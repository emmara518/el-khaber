name: ci

on:
  push:
    branches: [main, review/final-production-release]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: install · typecheck · lint · tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @khabir/shared-types --filter @khabir/shared-validation build

      # The API's PrismaService needs the generated client types before
      # typecheck/build/tests. Generation reads only schema.prisma — no DB
      # or secrets required.
      - name: Generate Prisma client
        run: pnpm --filter @khabir/api exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # API tests run against the in-memory FakePrisma harness — no database
      # or production secrets required. Real-DB integration specs self-skip
      # without a Supabase DATABASE_URL.
      - name: API tests
        run: pnpm --filter @khabir/api test

      - name: Mobile tests
        run: pnpm --filter @khabir/mobile test

  web-export:
    name: expo web export
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Web export
        run: pnpm --filter @khabir/mobile export:web

      - name: Verify export output
        run: test -f apps/mobile/dist-web/index.html
