components:
  schemas:
    AcceptedDto:
      additionalProperties: false
      description: Opaque acceptance marker. Reveals nothing about account existence.
      properties:
        accepted:
          enum:
            - true
          type: boolean
      required:
        - accepted
      type: object
    ApiMeta:
      additionalProperties: true
      description: >-
        List metadata (docs/07_API.md §19). The server normalizes page/limit (max server-enforced limit: 100) and
        computes total/totalPages/hasNext. Clients must never derive totals themselves.
      properties:
        hasNext:
          type: boolean
        limit:
          maximum: 100
          minimum: 1
          type: integer
        page:
          minimum: 1
          type: integer
        total:
          minimum: 0
          type: integer
        totalPages:
          minimum: 0
          type: integer
      type: object
    ApplianceCategoryDto:
      additionalProperties: false
      description: Active appliance category (customer-facing reference data).
      properties:
        iconUrl:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        imageUrl:
          nullable: true
          type: string
        nameAr:
          type: string
        slug:
          type: string
        sortOrder:
          type: integer
      required:
        - id
        - nameAr
        - slug
        - iconUrl
        - imageUrl
        - sortOrder
      type: object
    AuthSessionDto:
      additionalProperties: false
      description: Authentication session. The refresh token is returned exactly once per issuance/rotation.
      properties:
        accessToken:
          type: string
        expiresIn:
          description: Access token TTL in seconds.
          type: integer
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/AuthUserDto'
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
      type: object
    AuthUserDto:
      additionalProperties: false
      description: Public user record. Never includes credentials.
      properties:
        createdAt:
          format: date-time
          type: string
        email:
          nullable: true
          type: string
        emailVerified:
          type: boolean
        id:
          format: uuid
          type: string
        phone:
          nullable: true
          type: string
        phoneVerified:
          type: boolean
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
      required:
        - id
        - role
        - status
        - phone
        - email
        - phoneVerified
        - emailVerified
        - createdAt
      type: object
    CreateMerchantProductDto:
      additionalProperties: false
      description: >-
        POST /merchant/products payload. Ownership is derived from the JWT. `slug` is optional — server-derived from
        nameAr (unique per merchant). price may be null; no currency/discount/tax semantics exist.
      properties:
        descriptionAr:
          maxLength: 5000
          type: string
        imageUrl:
          maxLength: 512
          type: string
        nameAr:
          maxLength: 255
          minLength: 1
          type: string
        price:
          minimum: 0
          type: number
        slug:
          maxLength: 128
          minLength: 1
          type: string
        status:
          enum:
            - active
            - suspended
          type: string
        stockQuantity:
          minimum: 0
          type: integer
      required:
        - nameAr
      type: object
    CreateServiceRequestDto:
      additionalProperties: false
      description: >-
        Customer request creation payload (docs/07_API.md §7). problem_title is OPTIONAL (Task 10B CTO decision 2) and
        supports the "other problem" case without inventing diagnostic conclusions. The request is created with
        status=pending, targeted at the chosen verified technician.
      properties:
        appliance_category_id:
          format: uuid
          type: string
        fault_id:
          format: uuid
          type: string
        location_id:
          format: uuid
          type: string
        problem_description:
          maxLength: 5000
          minLength: 1
          type: string
        problem_title:
          maxLength: 255
          type: string
        scheduled_at:
          format: date-time
          type: string
        service_id:
          format: uuid
          type: string
        technician_id:
          format: uuid
          type: string
      required:
        - technician_id
        - appliance_category_id
        - problem_description
        - location_id
      type: object
    ErrorCode:
      enum:
        - AUTH_REQUIRED
        - AUTH_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_ERROR
        - CONFLICT
        - RATE_LIMITED
        - SUBSCRIPTION_REQUIRED
        - ENTITLEMENT_REQUIRED
        - INVALID_STATE_TRANSITION
        - UPLOAD_REJECTED
        - INTERNAL_ERROR
      type: string
    ErrorResponse:
      description: Canonical error envelope (docs/07_API.md §3).
      properties:
        error:
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            fields:
              additionalProperties:
                type: string
              description: Field-level validation details when applicable.
              type: object
            message:
              type: string
          required:
            - code
            - message
          type: object
      required:
        - error
      type: object
    FaultDto:
      additionalProperties: false
      description: >-
        Published fault-guide content. Guidance is advisory ("قد يكون...") — never diagnostic certainty; safety notes
        and technician escalation are part of the content contract.
      properties:
        applianceCategoryId:
          format: uuid
          type: string
        guidanceAr:
          type: string
        id:
          format: uuid
          type: string
        nameAr:
          type: string
        safetyNoteAr:
          nullable: true
          type: string
        severityLevel:
          nullable: true
          type: string
        slug:
          type: string
        summaryAr:
          type: string
        updatedAt:
          format: date-time
          type: string
        whenToCallTechnicianAr:
          nullable: true
          type: string
      required:
        - id
        - applianceCategoryId
        - nameAr
        - slug
        - severityLevel
        - summaryAr
        - guidanceAr
        - safetyNoteAr
        - whenToCallTechnicianAr
        - updatedAt
      type: object
    FaultSummaryDto:
      additionalProperties: false
      description: Published fault-guide list item (summary fields only).
      properties:
        applianceCategoryId:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        nameAr:
          type: string
        severityLevel:
          nullable: true
          type: string
        slug:
          type: string
        sortOrder:
          type: integer
        summaryAr:
          type: string
      required:
        - id
        - applianceCategoryId
        - nameAr
        - slug
        - severityLevel
        - summaryAr
        - sortOrder
      type: object
    HealthDto:
      additionalProperties: false
      description: Liveness payload (process-level only, no dependency checks).
      properties:
        service:
          enum:
            - api
          type: string
        status:
          enum:
            - ok
          type: string
      required:
        - status
        - service
      type: object
    MeDto:
      $ref: '#/components/schemas/AuthUserDto'
      description: Authenticated user profile (see AuthUserDto).
    MerchantProductDto:
      additionalProperties: false
      description: 'A merchant-owned catalog product (status: active | suspended).'
      properties:
        createdAt:
          format: date-time
          type: string
        descriptionAr:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        imageUrl:
          nullable: true
          type: string
        merchantId:
          format: uuid
          type: string
        nameAr:
          type: string
        price:
          nullable: true
          type: number
        slug:
          type: string
        status:
          enum:
            - active
            - suspended
          type: string
        stockQuantity:
          nullable: true
          type: integer
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - merchantId
        - nameAr
        - slug
        - descriptionAr
        - price
        - stockQuantity
        - imageUrl
        - status
        - createdAt
        - updatedAt
      type: object
    MerchantProfileDto:
      additionalProperties: false
      description: >-
        The authenticated merchant's own profile. verificationStatus is READ-ONLY (docs/09_ADMIN.md — admin is the
        verification authority). A missing profile returns 404 until the merchant PATCHes (onboarding).
      properties:
        bio:
          nullable: true
          type: string
        businessName:
          nullable: true
          type: string
        contactPhone:
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        locationId:
          format: uuid
          nullable: true
          type: string
        logoUrl:
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
      required:
        - id
        - businessName
        - bio
        - logoUrl
        - contactPhone
        - locationId
        - verificationStatus
        - createdAt
        - updatedAt
      type: object
    ReadyDto:
      additionalProperties: false
      description: Readiness payload with per-dependency check results.
      properties:
        checks:
          additionalProperties: false
          properties:
            database:
              enum:
                - ok
              type: string
          required:
            - database
          type: object
        status:
          enum:
            - ready
          type: string
      required:
        - status
        - checks
      type: object
    Role:
      enum:
        - customer
        - technician
        - merchant
      type: string
    ServiceDto:
      additionalProperties: false
      description: Active service/specialty catalog entry.
      properties:
        applianceCategoryId:
          format: uuid
          type: string
        descriptionAr:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        nameAr:
          type: string
        slug:
          type: string
      required:
        - id
        - applianceCategoryId
        - nameAr
        - slug
        - descriptionAr
      type: object
    ServiceRequestDto:
      additionalProperties: false
      description: >-
        Role-scoped request detail. The request location (job information) is included for the customer owner and the
        targeted/assigned technician. Status history is bounded and append-only.
      properties:
        acceptedAt:
          format: date-time
          nullable: true
          type: string
        applianceCategoryId:
          format: uuid
          type: string
        cancelledAt:
          format: date-time
          nullable: true
          type: string
        completedAt:
          format: date-time
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        faultId:
          format: uuid
          nullable: true
          type: string
        history:
          items:
            $ref: '#/components/schemas/ServiceRequestStatusHistoryDto'
          type: array
        id:
          format: uuid
          type: string
        location:
          additionalProperties: false
          properties:
            addressText:
              nullable: true
              type: string
            city:
              nullable: true
              type: string
            label:
              nullable: true
              type: string
            latitude:
              type: number
            longitude:
              type: number
            region:
              nullable: true
              type: string
          required:
            - label
            - addressText
            - city
            - region
            - latitude
            - longitude
          type: object
        problemDescription:
          type: string
        problemTitle:
          nullable: true
          type: string
        scheduledAt:
          format: date-time
          nullable: true
          type: string
        serviceId:
          format: uuid
          nullable: true
          type: string
        startedAt:
          format: date-time
          nullable: true
          type: string
        status:
          $ref: '#/components/schemas/ServiceRequestStatus'
        technicianId:
          format: uuid
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - status
        - problemTitle
        - problemDescription
        - applianceCategoryId
        - serviceId
        - faultId
        - technicianId
        - location
        - scheduledAt
        - acceptedAt
        - startedAt
        - completedAt
        - cancelledAt
        - createdAt
        - updatedAt
        - history
      type: object
    ServiceRequestStatus:
      enum:
        - pending
        - accepted
        - on_the_way
        - in_progress
        - completed
        - cancelled
      type: string
    ServiceRequestStatusHistoryDto:
      additionalProperties: false
      description: Append-only status transition record (docs/07_API.md §13).
      properties:
        changedByUserId:
          format: uuid
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        fromStatus:
          $ref: '#/components/schemas/ServiceRequestStatus'
          nullable: true
        id:
          format: uuid
          type: string
        toStatus:
          $ref: '#/components/schemas/ServiceRequestStatus'
      required:
        - id
        - fromStatus
        - toStatus
        - changedByUserId
        - createdAt
      type: object
    ServiceRequestSummaryDto:
      additionalProperties: false
      description: Role-scoped service-request list item.
      properties:
        applianceCategoryId:
          format: uuid
          type: string
        createdAt:
          format: date-time
          type: string
        faultId:
          format: uuid
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        problemDescription:
          type: string
        problemTitle:
          nullable: true
          type: string
        scheduledAt:
          format: date-time
          nullable: true
          type: string
        serviceId:
          format: uuid
          nullable: true
          type: string
        status:
          $ref: '#/components/schemas/ServiceRequestStatus'
        technicianId:
          format: uuid
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - status
        - problemTitle
        - problemDescription
        - applianceCategoryId
        - serviceId
        - faultId
        - technicianId
        - scheduledAt
        - createdAt
        - updatedAt
      type: object
    TechnicianAvailabilityStatus:
      enum:
        - available
        - busy
        - unavailable
      type: string
    TechnicianPublicDto:
      additionalProperties: false
      description: >-
        Public technician profile for discovery/detail. Only verified technicians are publicly visible. Excludes
        authentication data, private contact data, and internal moderation state.
      properties:
        availabilityStatus:
          $ref: '#/components/schemas/TechnicianAvailabilityStatus'
        avatarUrl:
          nullable: true
          type: string
        bio:
          nullable: true
          type: string
        completedServicesCount:
          type: integer
        displayName:
          nullable: true
          type: string
        experienceYears:
          type: integer
        id:
          format: uuid
          type: string
        ratingAverage:
          nullable: true
          type: number
        ratingCount:
          type: integer
        services:
          items:
            $ref: '#/components/schemas/TechnicianServiceDto'
          type: array
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
      required:
        - id
        - displayName
        - bio
        - avatarUrl
        - verificationStatus
        - availabilityStatus
        - experienceYears
        - completedServicesCount
        - ratingAverage
        - ratingCount
        - services
      type: object
    TechnicianServiceDto:
      additionalProperties: false
      description: A service/specialty offered by a technician (active only).
      properties:
        service:
          $ref: '#/components/schemas/ServiceDto'
      required:
        - service
      type: object
    UpdateMeDto:
      additionalProperties: false
      description: >-
        PATCH /me payload (docs/07_API.md §5). Only shared contact fields are writable. Changing a contact channel
        resets that channel's verification flag.
      properties:
        email:
          format: email
          type: string
        phone:
          pattern: ^\+?[0-9]{7,15}$
          type: string
      type: object
    UpdateMerchantProductDto:
      additionalProperties: false
      description: >-
        PATCH /merchant/products/:id payload — writable whitelist only. merchant ownership and product id are immutable;
        status is a validated active/suspended field (transitions unconstrained by the contract).
      properties:
        descriptionAr:
          maxLength: 5000
          type: string
        imageUrl:
          maxLength: 512
          type: string
        nameAr:
          maxLength: 255
          minLength: 1
          type: string
        price:
          minimum: 0
          type: number
        slug:
          maxLength: 128
          minLength: 1
          type: string
        status:
          enum:
            - active
            - suspended
          type: string
        stockQuantity:
          minimum: 0
          type: integer
      type: object
    UpdateMerchantProfileDto:
      additionalProperties: false
      description: >-
        PATCH /merchant/profile payload (onboarding persistence). Fields are optional; absent fields unchanged.
        verificationStatus is never writable.
      properties:
        bio:
          maxLength: 2000
          type: string
        businessName:
          maxLength: 255
          minLength: 1
          type: string
        contactPhone:
          pattern: ^\+?[0-9]{7,15}$
          type: string
        locationId:
          format: uuid
          type: string
        logoUrl:
          maxLength: 512
          type: string
      type: object
    UserStatus:
      enum:
        - active
        - suspended
        - pending
        - deleted
      type: string
    VerificationStatus:
      enum:
        - pending
        - verified
        - rejected
        - suspended
      type: string
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: >-
    Al-Khabir backend contract. Generated from the NestJS controllers (ADR-0003). The canonical success envelope is `{
    data, meta? }`; errors use `{ error: { code, message, fields? } }` with the codes documented in docs/07_API.md §21.
  title: Al-Khabir API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/v1/admin/auth/login:
    post:
      operationId: AdminAuthController_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                password:
                  maxLength: 128
                  minLength: 1
                  type: string
              required:
                - email
                - password
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSessionDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Admin session issued (separate authority).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid credentials.
      tags:
        - admin-auth
  /api/v1/admin/auth/logout:
    post:
      operationId: AdminAuthController_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                refreshToken:
                  maxLength: 4096
                  minLength: 20
                  type: string
              required:
                - refreshToken
              type: object
        required: true
      responses:
        '204':
          description: ''
      tags:
        - admin-auth
  /api/v1/admin/auth/refresh:
    post:
      operationId: AdminAuthController_refresh
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                refreshToken:
                  maxLength: 4096
                  minLength: 20
                  type: string
              required:
                - refreshToken
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSessionDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Rotated admin session issued.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid, expired, or replayed refresh token.
      tags:
        - admin-auth
  /api/v1/admin/me:
    get:
      operationId: AdminMeController_me
      parameters: []
      responses:
        '200':
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing, malformed, or expired admin access token.
      security:
        - bearer: []
      tags:
        - admin-auth
  /api/v1/appliance-categories:
    get:
      operationId: ApplianceCategoriesController_list
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/ApplianceCategoryDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Active appliance categories.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
      tags:
        - catalog
  /api/v1/auth/forgot-password:
    post:
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                phone:
                  pattern: ^\+?[0-9]{7,15}$
                  type: string
              type: object
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AcceptedDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Always 202; never reveals whether the account exists.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
      tags:
        - auth
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                password:
                  maxLength: 128
                  minLength: 1
                  type: string
                phone:
                  pattern: ^\+?[0-9]{7,15}$
                  type: string
              required:
                - password
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSessionDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Session issued.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid credentials (canonical error envelope).
      tags:
        - auth
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                refreshToken:
                  maxLength: 4096
                  minLength: 20
                  type: string
              required:
                - refreshToken
              type: object
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                refreshToken:
                  maxLength: 4096
                  minLength: 20
                  type: string
              required:
                - refreshToken
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSessionDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Rotated session issued.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid, expired, or replayed refresh token.
      tags:
        - auth
  /api/v1/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                password:
                  maxLength: 128
                  minLength: 10
                  pattern: '[0-9]'
                  type: string
                phone:
