          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentMethodConfigDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: All configured manual payment destinations.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Admin authority required.
      security:
        - bearer: []
      tags:
        - admin-payments
  /api/v1/admin/payments/config/{method}:
    put:
      operationId: AdminPaymentsController_upsertConfig
      parameters:
