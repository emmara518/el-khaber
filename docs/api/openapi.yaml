components:
  schemas:
    AcceptedDto:
      additionalProperties: false
      description: Opaque acceptance marker. Reveals nothing about account existence.
      properties:
        accepted:
          enum:
            - true
          type: boolean
      required:
        - accepted
      type: object
    ApiMeta:
      additionalProperties: true
      description: >-
        List metadata (docs/07_API.md §19). The server normalizes page/limit (max server-enforced limit: 100) and
        computes total/totalPages/hasNext. Clients must never derive totals themselves.
      properties:
        hasNext:
          type: boolean
        limit:
          maximum: 100
          minimum: 1
          type: integer
        page:
          minimum: 1
          type: integer
        total:
          minimum: 0
          type: integer
        totalPages:
          minimum: 0
          type: integer
      type: object
    AuthSessionDto:
      additionalProperties: false
      description: Authentication session. The refresh token is returned exactly once per issuance/rotation.
      properties:
        accessToken:
          type: string
        expiresIn:
          description: Access token TTL in seconds.
          type: integer
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/AuthUserDto'
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
      type: object
    AuthUserDto:
      additionalProperties: false
      description: Public user record. Never includes credentials.
      properties:
        createdAt:
          format: date-time
          type: string
        email:
          nullable: true
          type: string
        emailVerified:
          type: boolean
        id:
          format: uuid
          type: string
        phone:
          nullable: true
          type: string
        phoneVerified:
          type: boolean
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
      required:
        - id
        - role
        - status
        - phone
        - email
        - phoneVerified
        - emailVerified
        - createdAt
      type: object
    ErrorCode:
      enum:
        - AUTH_REQUIRED
        - AUTH_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_ERROR
        - CONFLICT
        - RATE_LIMITED
        - SUBSCRIPTION_REQUIRED
        - ENTITLEMENT_REQUIRED
        - INVALID_STATE_TRANSITION
        - UPLOAD_REJECTED
        - INTERNAL_ERROR
      type: string
    ErrorResponse:
      description: Canonical error envelope (docs/07_API.md §3).
      properties:
        error:
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            fields:
              additionalProperties:
                type: string
              description: Field-level validation details when applicable.
              type: object
            message:
              type: string
          required:
            - code
            - message
          type: object
      required:
        - error
      type: object
    HealthDto:
      additionalProperties: false
      description: Liveness payload (process-level only, no dependency checks).
      properties:
        service:
          enum:
            - api
          type: string
        status:
          enum:
            - ok
          type: string
      required:
        - status
        - service
      type: object
    MeDto:
      $ref: '#/components/schemas/AuthUserDto'
      description: Authenticated user profile (see AuthUserDto).
    ReadyDto:
      additionalProperties: false
      description: Readiness payload with per-dependency check results.
      properties:
        checks:
          additionalProperties: false
          properties:
            database:
              enum:
                - ok
              type: string
          required:
            - database
          type: object
        status:
          enum:
            - ready
          type: string
      required:
        - status
        - checks
      type: object
    Role:
      enum:
        - customer
        - technician
        - merchant
      type: string
    UpdateMeDto:
      additionalProperties: false
      description: >-
        PATCH /me payload (docs/07_API.md §5). Only shared contact fields are writable. Changing a contact channel
        resets that channel's verification flag.
      properties:
        email:
          format: email
          type: string
        phone:
          pattern: ^\+?[0-9]{7,15}$
          type: string
      type: object
    UserStatus:
      enum:
        - active
        - suspended
        - pending
        - deleted
      type: string
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: >-
    Al-Khabir backend contract. Generated from the NestJS controllers (ADR-0003). The canonical success envelope is `{
    data, meta? }`; errors use `{ error: { code, message, fields? } }` with the codes documented in docs/07_API.md §21.
  title: Al-Khabir API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/v1/admin/auth/login:
    post:
      operationId: AdminAuthController_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                password:
                  maxLength: 128
                  minLength: 1
                  type: string
              required:
                - email
                - password
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSessionDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Admin session issued (separate authority).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid credentials.
      tags:
        - admin-auth
  /api/v1/admin/auth/logout:
    post:
      operationId: AdminAuthController_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                refreshToken:
                  maxLength: 4096
                  minLength: 20
                  type: string
              required:
                - refreshToken
              type: object
        required: true
      responses:
        '204':
          description: ''
      tags:
        - admin-auth
  /api/v1/admin/auth/refresh:
    post:
      operationId: AdminAuthController_refresh
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                refreshToken:
                  maxLength: 4096
                  minLength: 20
                  type: string
              required:
                - refreshToken
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSessionDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Rotated admin session issued.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid, expired, or replayed refresh token.
      tags:
        - admin-auth
  /api/v1/admin/me:
    get:
      operationId: AdminMeController_me
      parameters: []
      responses:
        '200':
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing, malformed, or expired admin access token.
      security:
        - bearer: []
      tags:
        - admin-auth
  /api/v1/auth/forgot-password:
    post:
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                phone:
                  pattern: ^\+?[0-9]{7,15}$
                  type: string
              type: object
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AcceptedDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Always 202; never reveals whether the account exists.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
      tags:
        - auth
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                password:
                  maxLength: 128
                  minLength: 1
                  type: string
                phone:
                  pattern: ^\+?[0-9]{7,15}$
                  type: string
              required:
                - password
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSessionDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Session issued.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid credentials (canonical error envelope).
      tags:
        - auth
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                refreshToken:
                  maxLength: 4096
                  minLength: 20
                  type: string
              required:
                - refreshToken
              type: object
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                refreshToken:
                  maxLength: 4096
                  minLength: 20
                  type: string
              required:
                - refreshToken
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSessionDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Rotated session issued.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid, expired, or replayed refresh token.
      tags:
        - auth
  /api/v1/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                password:
                  maxLength: 128
                  minLength: 10
                  pattern: '[0-9]'
                  type: string
                phone:
                  pattern: ^\+?[0-9]{7,15}$
                  type: string
                role:
                  enum:
                    - customer
                    - technician
                    - merchant
                  type: string
              required:
                - role
                - password
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSessionDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Account created; session issued.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Phone or email already in use (canonical error envelope).
      tags:
        - auth
  /api/v1/auth/reset-password:
    post:
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                password:
                  maxLength: 128
                  minLength: 10
                  pattern: '[0-9]'
                  type: string
                token:
                  maxLength: 4096
                  minLength: 20
                  type: string
              required:
                - token
                - password
              type: object
        required: true
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid, expired, or already-used reset token.
      tags:
        - auth
  /api/v1/health:
    get:
      operationId: HealthController_health
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/HealthDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Liveness probe (process-level only).
      tags:
        - health
  /api/v1/me:
    get:
      operationId: MeController_me
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/MeDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Current authenticated user.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing, malformed, or expired access token.
      security:
        - bearer: []
      tags:
        - me
    patch:
      operationId: MeController_updateMe
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                phone:
                  pattern: ^\+?[0-9]{7,15}$
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/MeDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Updated user (contact fields changed).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing, malformed, or expired access token.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Phone or email already in use (canonical error envelope).
      security:
        - bearer: []
      tags:
        - me
  /api/v1/ready:
    get:
      operationId: HealthController_ready
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/ReadyDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Readiness probe (dependencies verified).
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A required dependency is unavailable (canonical error envelope).
      tags:
        - health
