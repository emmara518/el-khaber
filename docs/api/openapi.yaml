            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                account_identifier:
                  maxLength: 255
                  minLength: 1
                  type: string
                display_name:
                  maxLength: 255
                  minLength: 1
                  type: string
                is_enabled:
                  type: boolean
              required:
                - account_identifier
                - display_name
                - is_enabled
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentMethodConfigDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Payment destination upserted (audited).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Admin authority required.
      security:
        - bearer: []
      tags:
        - admin-payments
  /api/v1/admin/payments/submissions:
