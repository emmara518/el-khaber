components:
  schemas:
    AcceptedDto:
      additionalProperties: false
      description: Opaque acceptance marker. Reveals nothing about account existence.
      properties:
        accepted:
          enum:
            - true
          type: boolean
      required:
        - accepted
      type: object
    AdminGrantResultDto:
      additionalProperties: false
      description: Admin manual grant result (subscription or entitlement grant).
      properties:
        code:
          nullable: true
          type: string
        entitlementId:
          format: uuid
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        planId:
          format: uuid
          nullable: true
          type: string
        status:
          nullable: true
          type: string
        userId:
          format: uuid
          type: string
      required:
        - id
        - userId
      type: object
    AdminNotificationResultDto:
      additionalProperties: false
      description: Admin operational notification creation result.
      properties:
        id:
          format: uuid
          type: string
        type:
          type: string
        userId:
          format: uuid
          type: string
      required:
        - id
        - userId
        - type
      type: object
    ApiMeta:
      additionalProperties: true
      description: >-
        List metadata (docs/07_API.md §19). The server normalizes page/limit (max server-enforced limit: 100) and
        computes total/totalPages/hasNext. Clients must never derive totals themselves.
      properties:
        hasNext:
          type: boolean
        limit:
          maximum: 100
          minimum: 1
          type: integer
        page:
          minimum: 1
          type: integer
        total:
          minimum: 0
          type: integer
        totalPages:
          minimum: 0
          type: integer
      type: object
    ApplianceCategoryDto:
      additionalProperties: false
      description: Active appliance category (customer-facing reference data).
      properties:
        iconUrl:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        imageUrl:
          nullable: true
          type: string
        nameAr:
          type: string
        slug:
          type: string
        sortOrder:
          type: integer
      required:
        - id
        - nameAr
        - slug
        - iconUrl
        - imageUrl
        - sortOrder
      type: object
    AuthSessionDto:
      additionalProperties: false
      description: Authentication session. The refresh token is returned exactly once per issuance/rotation.
      properties:
        accessToken:
          type: string
        expiresIn:
          description: Access token TTL in seconds.
          type: integer
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/AuthUserDto'
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
      type: object
    AuthUserDto:
      additionalProperties: false
      description: Public user record. Never includes credentials.
      properties:
        createdAt:
          format: date-time
          type: string
        email:
          nullable: true
          type: string
        emailVerified:
          type: boolean
        id:
          format: uuid
          type: string
        phone:
          nullable: true
          type: string
        phoneVerified:
          type: boolean
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
      required:
        - id
        - role
        - status
        - phone
        - email
        - phoneVerified
        - emailVerified
        - createdAt
      type: object
    ConversationDto:
      additionalProperties: false
      description: >-
        The service-request conversation (1:1 with the request). Participants are the request customer and the
        targeted/assigned technician.
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        requestStatus:
          $ref: '#/components/schemas/ServiceRequestStatus'
        serviceRequestId:
          format: uuid
          type: string
      required:
        - id
        - serviceRequestId
        - requestStatus
        - createdAt
      type: object
    CreateMerchantProductDto:
      additionalProperties: false
      description: >-
        POST /merchant/products payload. Ownership is derived from the JWT. `slug` is optional — server-derived from
        nameAr (unique per merchant). price may be null; no currency/discount/tax semantics exist.
      properties:
        descriptionAr:
          maxLength: 5000
          type: string
        imageUrl:
          maxLength: 512
          type: string
        nameAr:
          maxLength: 255
          minLength: 1
          type: string
        price:
          minimum: 0
          type: number
        slug:
          maxLength: 128
          minLength: 1
          type: string
        status:
          enum:
            - active
            - suspended
          type: string
        stockQuantity:
          minimum: 0
          type: integer
      required:
        - nameAr
      type: object
    CreatePaymentSubmissionDto:
      additionalProperties: false
      description: >-
        POST /subscriptions payload: manual payment submission (Task 10I). MVP methods: instapay | vodafone_cash. The
        submission stays PENDING until ADMIN approval; user input is never authoritative. proof_storage_key is a typed
        reference reserved for the future media task.
      properties:
        method:
          enum:
            - instapay
            - vodafone_cash
          type: string
        plan_id:
          format: uuid
          type: string
        proof_storage_key:
          maxLength: 512
          minLength: 4
          type: string
        transfer_reference:
          maxLength: 100
          minLength: 4
          type: string
      required:
        - plan_id
        - method
        - transfer_reference
      type: object
    CreateReviewDto:
      additionalProperties: false
      description: >-
        POST /service-requests/:id/review payload. Eligibility is documented: the request owner, after completion, one
        review per request. Tags must reference seeded/documented review tags.
      properties:
        comment:
          maxLength: 2000
          type: string
        rating:
          maximum: 5
          minimum: 1
          type: integer
        tag_ids:
          items:
            format: uuid
            type: string
          maxItems: 10
          type: array
      required:
        - rating
      type: object
    CreateServiceRequestDto:
      additionalProperties: false
      description: >-
        Customer request creation payload (docs/07_API.md §7). problem_title is OPTIONAL (Task 10B CTO decision 2) and
        supports the "other problem" case without inventing diagnostic conclusions. The request is created with
        status=pending, targeted at the chosen verified technician.
      properties:
        appliance_category_id:
          format: uuid
          type: string
        fault_id:
          format: uuid
          type: string
        location_id:
          format: uuid
          type: string
        problem_description:
          maxLength: 5000
          minLength: 1
          type: string
        problem_title:
          maxLength: 255
          type: string
        scheduled_at:
          format: date-time
          type: string
        service_id:
          format: uuid
          type: string
        technician_id:
          format: uuid
          type: string
      required:
        - technician_id
        - appliance_category_id
        - problem_description
        - location_id
      type: object
    CreateTechnicianServiceDto:
      additionalProperties: false
      description: POST /technician/services payload (attach a catalog service).
      properties:
        price_from:
          minimum: 0
          type: number
        service_id:
          format: uuid
          type: string
      required:
        - service_id
      type: object
    CurrentSubscriptionDto:
      additionalProperties: false
      description: The principal current subscription with its plan (null when none).
      properties:
        cancelledAt:
          format: date-time
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        currentPeriodEnd:
          format: date-time
          type: string
        currentPeriodStart:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        plan:
          additionalProperties: false
          properties:
            billingInterval:
              type: string
            code:
              type: string
            currency:
              type: string
            id:
              format: uuid
              type: string
            isActive:
              type: boolean
            nameAr:
              type: string
            nameEn:
              nullable: true
              type: string
            price:
              type: number
            role:
              enum:
                - customer
                - technician
                - merchant
              type: string
          required:
            - id
            - code
            - nameAr
            - nameEn
            - role
            - price
            - currency
            - billingInterval
            - isActive
          type: object
        renewalEnabled:
          type: boolean
        startedAt:
          format: date-time
          type: string
        status:
          enum:
            - active
            - pending
            - trialing
            - past_due
            - cancelled
            - expired
          type: string
      required:
        - id
        - status
        - startedAt
        - currentPeriodStart
        - currentPeriodEnd
        - renewalEnabled
        - cancelledAt
        - createdAt
        - plan
      type: object
    ErrorCode:
      enum:
        - AUTH_REQUIRED
        - AUTH_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_ERROR
        - CONFLICT
        - RATE_LIMITED
        - SUBSCRIPTION_REQUIRED
        - ENTITLEMENT_REQUIRED
        - INVALID_STATE_TRANSITION
        - UPLOAD_REJECTED
        - INTERNAL_ERROR
      type: string
    ErrorResponse:
      description: Canonical error envelope (docs/07_API.md §3).
      properties:
        error:
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            fields:
              additionalProperties:
                type: string
              description: Field-level validation details when applicable.
              type: object
            message:
              type: string
          required:
            - code
            - message
          type: object
      required:
        - error
      type: object
    FaultDto:
      additionalProperties: false
      description: >-
        Published fault-guide content. Guidance is advisory ("قد يكون...") — never diagnostic certainty; safety notes
        and technician escalation are part of the content contract.
      properties:
        applianceCategoryId:
          format: uuid
          type: string
        guidanceAr:
          type: string
        id:
          format: uuid
          type: string
        nameAr:
          type: string
        safetyNoteAr:
          nullable: true
          type: string
        severityLevel:
          nullable: true
          type: string
        slug:
          type: string
        summaryAr:
          type: string
        updatedAt:
          format: date-time
          type: string
        whenToCallTechnicianAr:
          nullable: true
          type: string
      required:
        - id
        - applianceCategoryId
        - nameAr
        - slug
        - severityLevel
        - summaryAr
        - guidanceAr
        - safetyNoteAr
        - whenToCallTechnicianAr
        - updatedAt
      type: object
    FaultSummaryDto:
      additionalProperties: false
      description: Published fault-guide list item (summary fields only).
      properties:
        applianceCategoryId:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        nameAr:
          type: string
        severityLevel:
          nullable: true
          type: string
        slug:
          type: string
        sortOrder:
          type: integer
        summaryAr:
          type: string
      required:
        - id
        - applianceCategoryId
        - nameAr
        - slug
        - severityLevel
        - summaryAr
        - sortOrder
      type: object
    HealthDto:
      additionalProperties: false
      description: Liveness payload (process-level only, no dependency checks).
      properties:
        service:
          enum:
            - api
          type: string
        status:
          enum:
            - ok
          type: string
      required:
        - status
        - service
      type: object
    LocationDto:
      additionalProperties: false
      description: >-
        User-owned location (docs/07_API.md §8, docs/06_DATABASE.md §6). Coordinates are optional (label/address-only
        locations are valid).
      properties:
        addressText:
          nullable: true
          type: string
        city:
          nullable: true
          type: string
        country:
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        label:
          nullable: true
          type: string
        latitude:
          nullable: true
          type: number
        longitude:
          nullable: true
          type: number
        region:
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - label
        - addressText
        - city
        - region
        - country
        - latitude
        - longitude
        - createdAt
        - updatedAt
      type: object
    MeDto:
      $ref: '#/components/schemas/AuthUserDto'
      description: Authenticated user profile (see AuthUserDto).
    MeEntitlementsDto:
      additionalProperties: false
      description: 'GET /me/entitlements (docs/07 §15): effective entitlement codes.'
      properties:
        entitlements:
          items:
            type: string
          type: array
      required:
        - entitlements
      type: object
    MeSubscriptionDto:
      additionalProperties: false
      description: 'GET /me/subscription: current subscription + effective entitlement codes.'
      properties:
        entitlements:
          items:
            type: string
          type: array
        subscription:
          $ref: '#/components/schemas/CurrentSubscriptionDto'
          nullable: true
      required:
        - subscription
        - entitlements
      type: object
    MerchantProductDto:
      additionalProperties: false
      description: 'A merchant-owned catalog product (status: active | suspended).'
      properties:
        createdAt:
          format: date-time
          type: string
        descriptionAr:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        imageUrl:
          nullable: true
          type: string
        merchantId:
          format: uuid
          type: string
        nameAr:
          type: string
        price:
          nullable: true
          type: number
        slug:
          type: string
        status:
          enum:
            - active
            - suspended
          type: string
        stockQuantity:
          nullable: true
          type: integer
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - merchantId
        - nameAr
        - slug
        - descriptionAr
        - price
        - stockQuantity
        - imageUrl
        - status
        - createdAt
        - updatedAt
      type: object
    MerchantProfileDto:
      additionalProperties: false
      description: >-
        The authenticated merchant's own profile. verificationStatus is READ-ONLY (docs/09_ADMIN.md — admin is the
        verification authority). A missing profile returns 404 until the merchant PATCHes (onboarding).
      properties:
        bio:
          nullable: true
          type: string
        businessName:
          nullable: true
          type: string
        contactPhone:
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        locationId:
          format: uuid
          nullable: true
          type: string
        logoUrl:
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
      required:
        - id
        - businessName
        - bio
        - logoUrl
        - contactPhone
        - locationId
        - verificationStatus
        - createdAt
        - updatedAt
      type: object
    MessageDto:
      additionalProperties: false
      description: >-
        Chat message. Ordered newest-first for pagination; the client adapter may reverse for display. readAt exists in
        the model but no mark-read route is documented (deferred).
      properties:
        body:
          type: string
        conversationId:
          format: uuid
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        messageType:
          enum:
            - text
          type: string
        senderUserId:
          format: uuid
          type: string
      required:
        - id
        - conversationId
        - senderUserId
        - messageType
        - body
        - createdAt
      type: object
    NotificationDto:
      additionalProperties: false
      description: "A persisted notification for the authenticated recipient. \type is an open string until product trigger types are ratified; no delivery provider exists (persistence + read APIs only)."
      properties:
        bodyAr:
          type: string
        createdAt:
          format: date-time
          type: string
        dataJson:
          additionalProperties: true
          nullable: true
          type: object
        id:
          format: uuid
          type: string
        readAt:
          format: date-time
          nullable: true
          type: string
        titleAr:
          type: string
        type:
          type: string
      required:
        - id
        - type
        - titleAr
        - bodyAr
        - dataJson
        - readAt
        - createdAt
      type: object
    PaymentMethodConfigDto:
      additionalProperties: false
      description: Admin-managed manual payment destination (method + account + display name).
      properties:
        accountIdentifier:
          type: string
        displayName:
          type: string
        isEnabled:
          type: boolean
        method:
          enum:
            - instapay
            - vodafone_cash
          type: string
      required:
        - method
        - accountIdentifier
        - displayName
        - isEnabled
      type: object
    PaymentReviewResultDto:
      additionalProperties: false
      description: Admin approval/rejection result payload.
      properties:
        id:
          format: uuid
          type: string
        status:
          enum:
            - approved
            - rejected
          type: string
        subscriptionId:
          format: uuid
          nullable: true
          type: string
      required:
        - id
        - status
      type: object
    PaymentSubmissionDto:
      additionalProperties: false
      description: Manual payment submission (pending → approved | rejected by ADMIN only).
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        method:
          enum:
            - instapay
            - vodafone_cash
          type: string
        planId:
          format: uuid
          type: string
        proofStorageKey:
          nullable: true
          type: string
        reviewedAt:
          format: date-time
          nullable: true
          type: string
        status:
          enum:
            - pending
            - approved
            - rejected
          type: string
        subscriptionId:
          format: uuid
          nullable: true
          type: string
        transferReference:
          type: string
        updatedAt:
          format: date-time
          type: string
        userId:
          format: uuid
          type: string
      required:
        - id
        - userId
        - planId
        - subscriptionId
        - method
        - transferReference
        - proofStorageKey
        - status
        - reviewedAt
        - createdAt
        - updatedAt
      type: object
    ReadyDto:
      additionalProperties: false
      description: Readiness payload with per-dependency check results.
      properties:
        checks:
          additionalProperties: false
          properties:
            database:
              enum:
                - ok
              type: string
          required:
            - database
          type: object
        status:
          enum:
            - ready
          type: string
      required:
        - status
        - checks
      type: object
    ReviewSummaryDto:
      additionalProperties: false
      description: >-
        Public review for technician discovery. Only documented public fields: no customer identifiers, no moderation
        state.
      properties:
        comment:
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        rating:
          maximum: 5
          minimum: 1
          type: integer
        tags:
          items:
            type: string
          type: array
      required:
        - id
        - rating
        - comment
        - tags
        - createdAt
      type: object
    Role:
      enum:
        - customer
        - technician
        - merchant
      type: string
    SendMessageDto:
      additionalProperties: false
      description: >-
        POST /conversations/:id/messages payload. Text content only � attachment types require storage infrastructure
        (later task). The sender is derived from the verified JWT, never from the payload.
      properties:
        body:
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - body
      type: object
    ServiceDto:
      additionalProperties: false
      description: Active service/specialty catalog entry.
      properties:
        applianceCategoryId:
          format: uuid
          type: string
        descriptionAr:
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        nameAr:
          type: string
        slug:
          type: string
      required:
        - id
        - applianceCategoryId
        - nameAr
        - slug
        - descriptionAr
      type: object
    ServiceRequestDto:
      additionalProperties: false
      description: >-
        Role-scoped request detail. The request location (job information) is included for the customer owner and the
        targeted/assigned technician. Status history is bounded and append-only.
      properties:
        acceptedAt:
          format: date-time
          nullable: true
          type: string
        applianceCategoryId:
          format: uuid
          type: string
        cancelledAt:
          format: date-time
          nullable: true
          type: string
        completedAt:
          format: date-time
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        faultId:
          format: uuid
          nullable: true
          type: string
        history:
          items:
            $ref: '#/components/schemas/ServiceRequestStatusHistoryDto'
          type: array
        id:
          format: uuid
          type: string
        location:
          additionalProperties: false
          properties:
            addressText:
              nullable: true
              type: string
            city:
              nullable: true
              type: string
            label:
              nullable: true
              type: string
            latitude:
              type: number
            longitude:
              type: number
            region:
              nullable: true
              type: string
          required:
            - label
            - addressText
            - city
            - region
            - latitude
            - longitude
          type: object
        problemDescription:
          type: string
        problemTitle:
          nullable: true
          type: string
        scheduledAt:
          format: date-time
          nullable: true
          type: string
        serviceId:
          format: uuid
          nullable: true
          type: string
        startedAt:
          format: date-time
          nullable: true
          type: string
        status:
          $ref: '#/components/schemas/ServiceRequestStatus'
        technicianId:
          format: uuid
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - status
        - problemTitle
        - problemDescription
        - applianceCategoryId
        - serviceId
        - faultId
        - technicianId
        - location
        - scheduledAt
        - acceptedAt
        - startedAt
        - completedAt
        - cancelledAt
        - createdAt
        - updatedAt
        - history
      type: object
    ServiceRequestStatus:
      enum:
        - pending
        - accepted
        - on_the_way
        - in_progress
        - completed
        - cancelled
      type: string
    ServiceRequestStatusHistoryDto:
      additionalProperties: false
      description: Append-only status transition record (docs/07_API.md §13).
      properties:
        changedByUserId:
          format: uuid
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        fromStatus:
          $ref: '#/components/schemas/ServiceRequestStatus'
          nullable: true
        id:
          format: uuid
          type: string
        toStatus:
          $ref: '#/components/schemas/ServiceRequestStatus'
      required:
        - id
        - fromStatus
        - toStatus
        - changedByUserId
        - createdAt
      type: object
    ServiceRequestSummaryDto:
      additionalProperties: false
      description: Role-scoped service-request list item.
      properties:
        applianceCategoryId:
          format: uuid
          type: string
        createdAt:
          format: date-time
          type: string
        faultId:
          format: uuid
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        problemDescription:
          type: string
        problemTitle:
          nullable: true
          type: string
        scheduledAt:
          format: date-time
          nullable: true
          type: string
        serviceId:
          format: uuid
          nullable: true
          type: string
        status:
          $ref: '#/components/schemas/ServiceRequestStatus'
        technicianId:
          format: uuid
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - status
        - problemTitle
        - problemDescription
        - applianceCategoryId
        - serviceId
        - faultId
        - technicianId
        - scheduledAt
        - createdAt
        - updatedAt
      type: object
    SubscriptionPlanDto:
      additionalProperties: false
      description: Active subscription plan (role-aware, docs/08 §3).
      properties:
        billingInterval:
          type: string
        code:
          type: string
        currency:
          type: string
        id:
          format: uuid
          type: string
        isActive:
          type: boolean
        nameAr:
          type: string
        nameEn:
          nullable: true
          type: string
        price:
          type: number
        role:
          enum:
            - customer
            - technician
            - merchant
          type: string
        sortOrder:
          type: integer
      required:
        - id
        - role
        - code
        - nameAr
        - nameEn
        - billingInterval
        - price
        - currency
        - isActive
        - sortOrder
      type: object
    TechnicianAvailabilityStatus:
      enum:
        - available
        - busy
        - unavailable
      type: string
    TechnicianPublicDto:
      additionalProperties: false
      description: >-
        Public technician profile for discovery/detail. Only verified technicians are publicly visible. Excludes
        authentication data, private contact data, and internal moderation state.
      properties:
        availabilityStatus:
          $ref: '#/components/schemas/TechnicianAvailabilityStatus'
        avatarUrl:
          nullable: true
          type: string
        bio:
          nullable: true
          type: string
        completedServicesCount:
          type: integer
        displayName:
          nullable: true
          type: string
        experienceYears:
          type: integer
        id:
          format: uuid
          type: string
        ratingAverage:
          nullable: true
          type: number
        ratingCount:
          type: integer
        services:
          items:
            $ref: '#/components/schemas/TechnicianServiceDto'
          type: array
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
      required:
        - id
        - displayName
        - bio
        - avatarUrl
        - verificationStatus
        - availabilityStatus
        - experienceYears
        - completedServicesCount
        - ratingAverage
        - ratingCount
        - services
      type: object
    TechnicianSelfAreaDto:
      additionalProperties: false
      description: Technician service area (label; coordinates optional).
      properties:
        labelAr:
          type: string
        latitude:
          nullable: true
          type: number
        longitude:
          nullable: true
          type: number
      required:
        - labelAr
        - latitude
        - longitude
      type: object
    TechnicianSelfProfileDto:
      additionalProperties: false
      description: >-
        Own technician profile. verificationStatus/ratings/counters are server-owned (admin is the verification
        authority); areas are label-based with OPTIONAL coordinates (label-only areas carry no geo and are excluded from
        radius filtering).
      properties:
        areas:
          items:
            $ref: '#/components/schemas/TechnicianSelfAreaDto'
          type: array
        availabilityStatus:
          $ref: '#/components/schemas/TechnicianAvailabilityStatus'
        avatarUrl:
          nullable: true
          type: string
        bio:
          nullable: true
          type: string
        completedServicesCount:
          type: integer
        displayName:
          nullable: true
          type: string
        experienceYears:
          type: integer
        id:
          format: uuid
          type: string
        ratingAverage:
          nullable: true
          type: number
        ratingCount:
          type: integer
        services:
          items:
            $ref: '#/components/schemas/TechnicianSelfServiceDto'
          type: array
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
      required:
        - id
        - displayName
        - bio
        - avatarUrl
        - verificationStatus
        - experienceYears
        - completedServicesCount
        - ratingAverage
        - ratingCount
        - availabilityStatus
        - services
        - areas
      type: object
    TechnicianSelfService:
      additionalProperties: false
      description: GET /technician/services item.
      properties:
        applianceCategoryId:
          format: uuid
          type: string
        isActive:
          type: boolean
        nameAr:
          type: string
        priceFrom:
          nullable: true
          type: number
        serviceId:
          format: uuid
          type: string
        slug:
          type: string
      required:
        - serviceId
        - nameAr
        - slug
        - applianceCategoryId
        - priceFrom
        - isActive
      type: object
    TechnicianSelfServiceDto:
      additionalProperties: false
      description: A catalog service attached by the technician.
      properties:
        applianceCategoryId:
          format: uuid
          type: string
        nameAr:
          type: string
        priceFrom:
          nullable: true
          type: number
        serviceId:
          format: uuid
          type: string
        slug:
          type: string
      required:
        - serviceId
        - nameAr
        - slug
        - applianceCategoryId
        - priceFrom
      type: object
    TechnicianServiceDto:
      additionalProperties: false
      description: A service/specialty offered by a technician (active only).
      properties:
        service:
          $ref: '#/components/schemas/ServiceDto'
      required:
        - service
      type: object
    TechnicianStatsDto:
      additionalProperties: false
      description: Server-derived technician request counters + rating metrics.
      properties:
        completedCount:
          minimum: 0
          type: integer
        completedServicesCount:
          minimum: 0
          type: integer
        inProgressCount:
          minimum: 0
          type: integer
        onTheWayCount:
          minimum: 0
          type: integer
        pendingCount:
          minimum: 0
          type: integer
        ratingAverage:
          nullable: true
          type: number
        ratingCount:
          minimum: 0
          type: integer
      required:
        - pendingCount
        - onTheWayCount
        - inProgressCount
        - completedCount
        - completedServicesCount
        - ratingAverage
        - ratingCount
      type: object
    UpdateMeDto:
      additionalProperties: false
      description: >-
        PATCH /me payload (docs/07_API.md §5). Only shared contact fields are writable. Changing a contact channel
        resets that channel's verification flag.
      properties:
        email:
          format: email
          type: string
        phone:
          pattern: ^\+?[0-9]{7,15}$
          type: string
      type: object
    UpdateMerchantProductDto:
      additionalProperties: false
      description: >-
        PATCH /merchant/products/:id payload — writable whitelist only. merchant ownership and product id are immutable;
        status is a validated active/suspended field (transitions unconstrained by the contract).
      properties:
        descriptionAr:
          maxLength: 5000
          type: string
        imageUrl:
          maxLength: 512
          type: string
        nameAr:
          maxLength: 255
          minLength: 1
          type: string
        price:
          minimum: 0
          type: number
        slug:
          maxLength: 128
          minLength: 1
          type: string
        status:
          enum:
            - active
            - suspended
          type: string
        stockQuantity:
          minimum: 0
          type: integer
      type: object
    UpdateMerchantProfileDto:
      additionalProperties: false
      description: >-
        PATCH /merchant/profile payload (onboarding persistence). Fields are optional; absent fields unchanged.
        verificationStatus is never writable.
      properties:
        bio:
          maxLength: 2000
          type: string
        businessName:
          maxLength: 255
          minLength: 1
          type: string
        contactPhone:
          pattern: ^\+?[0-9]{7,15}$
          type: string
        locationId:
          format: uuid
          type: string
        logoUrl:
          maxLength: 512
          type: string
      type: object
    UpdateTechnicianProfileDto:
      additionalProperties: false
      description: >-
        PATCH /technician/profile payload. Editable: display_name, bio, avatar_url, experience_years, areas (label +
        optional coordinates). verificationStatus/ratings/counters are NEVER writable.
      properties:
        areas:
          items:
            additionalProperties: false
            properties:
              label_ar:
                maxLength: 128
                minLength: 1
                type: string
              latitude:
                maximum: 90
                minimum: -90
                type: number
              longitude:
                maximum: 180
                minimum: -180
                type: number
            required:
              - label_ar
            type: object
          maxItems: 10
          type: array
        avatar_url:
          maxLength: 512
          minLength: 1
          type: string
        bio:
          maxLength: 2000
          type: string
        display_name:
          maxLength: 255
          minLength: 1
          type: string
        experience_years:
          maximum: 60
          minimum: 0
          type: integer
      type: object
    UserStatus:
      enum:
        - active
        - suspended
        - pending
        - deleted
      type: string
    VerificationStatus:
      enum:
        - pending
        - verified
        - rejected
        - suspended
      type: string
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: >-
    Al-Khabir backend contract. Generated from the NestJS controllers (ADR-0003). The canonical success envelope is `{
    data, meta? }`; errors use `{ error: { code, message, fields? } }` with the codes documented in docs/07_API.md §21.
  title: Al-Khabir API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/v1/admin/audit-logs:
    get:
      operationId: AdminController_listAuditLogs
      parameters:
        - in: query
          name: page
          required: false
          schema:
            minimum: 1
            type: integer
        - in: query
          name: limit
          required: false
          schema:
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: entity_type
          required: false
          schema:
            maxLength: 64
            minLength: 1
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuditLogDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Audit trail (entity-type filter; newest first).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Admin authority required.
      security:
        - bearer: []
      tags:
        - admin
  /api/v1/admin/auth/login:
    post:
      operationId: AdminAuthController_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                email:
                  type: string
                password:
                  maxLength: 128
                  minLength: 1
                  type: string
              required:
                - email
                - password
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSessionDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Admin session issued (separate authority).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid credentials.
      tags:
        - admin-auth
  /api/v1/admin/auth/logout:
    post:
      operationId: AdminAuthController_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                refreshToken:
                  maxLength: 4096
                  minLength: 20
                  type: string
              required:
                - refreshToken
              type: object
        required: true
      responses:
        '204':
          description: ''
      tags:
        - admin-auth
  /api/v1/admin/auth/refresh:
    post:
      operationId: AdminAuthController_refresh
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                refreshToken:
                  maxLength: 4096
                  minLength: 20
                  type: string
              required:
                - refreshToken
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AuthSessionDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Rotated admin session issued.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid, expired, or replayed refresh token.
      tags:
        - admin-auth
  /api/v1/admin/entitlements/grant:
    post:
      operationId: AdminGrantsController_grantEntitlement
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                entitlement_id:
                  type: string
                user_id:
                  type: string
              required:
                - user_id
                - entitlement_id
              type: object
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AdminGrantResultDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Entitlement granted manually (audited).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Admin authority required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User or entitlement not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entitlement already granted / inactive.
      security:
        - bearer: []
      tags:
        - admin
  /api/v1/admin/me:
    get:
      operationId: AdminMeController_me
      parameters: []
      responses:
        '200':
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing, malformed, or expired admin access token.
      security:
        - bearer: []
      tags:
        - admin-auth
  /api/v1/admin/merchants:
    get:
      operationId: AdminController_listMerchants
      parameters:
        - in: query
          name: page
          required: false
          schema:
            minimum: 1
            type: integer
        - in: query
          name: limit
          required: false
          schema:
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: q
          required: false
          schema:
            maxLength: 100
            minLength: 1
            type: string
        - in: query
          name: verification_status
          required: false
          schema:
            enum:
              - pending
              - verified
              - rejected
              - suspended
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AdminMerchantDto'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
                required:
                  - data
                type: object
          description: Merchant profiles (verification filter).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation failed (canonical error envelope).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Admin authority required.
      security:
        - bearer: []
      tags:
        - admin
  /api/v1/admin/merchants/{id}/verification:
    post:
      operationId: AdminController_setMerchantVerification
      parameters:
        - in: path
          name: id
