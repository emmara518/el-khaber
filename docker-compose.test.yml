# Disposable PostgreSQL for local API integration/E2E tests.
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   DATABASE_URL=postgresql://khabir:khabir@localhost:5433/khabir_test \
#     pnpm --filter @khabir/api exec prisma migrate deploy
#   pnpm --filter @khabir/api test
#   docker compose -f docker-compose.test.yml down -v
services:
  test-db:
    image: postgis/postgis:16-3.4
    container_name: khabir-v21-test-db
    environment:
      POSTGRES_USER: khabir
      POSTGRES_PASSWORD: khabir
      POSTGRES_DB: khabir_test
    ports:
      - "5433:5432"
    volumes:
      - ./apps/api/prisma/test-db-init.sql:/docker-entrypoint-initdb.d/10-supabase-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khabir -d khabir_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
