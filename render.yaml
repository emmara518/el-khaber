# Render Blueprint — EL-KHABIR API (production-delivery environment)
#
# Deploys the EXISTING NestJS API unchanged, using the existing
# apps/api/Dockerfile (monorepo-root build context). No Render database or
# Key Value is created: Supabase (khabir-dev) remains the only database.
#
# Secrets are NOT stored here: every secret uses `sync: false`, so Render
# prompts for the value (or it is provided via the Render dashboard / MCP)
# and never lands in git. See the release runbook for the value sources.
#
# Apply: Render dashboard -> New -> Blueprint -> select this repo/branch.
# (Or create the web service via the Render MCP and match these settings.)

services:
  - type: web
    name: khabir-api
    runtime: docker
    plan: free                        # zero-cost UAT: Render Free web service only
    region: frankfurt                 # closest to Supabase eu-west-1 (khabir-dev)
    repo: https://github.com/emmara518/el-khaber
    branch: review/final-production-release
    # WARNING (operational risk, documented in the release runbook):
    # autoDeploy publishes whatever git HEAD this branch points at. Until
    # the pending un-committed work tree (~110 modified + ~33 untracked
    # files, incl. the current security batch) is committed, a push of the
    # OLD reviewed HEAD would deploy a tree OLDER than what exists locally
    # after review. Before flipping autoDeploy: either commit this batch or
    # set autoDeploy to false in the dashboard. This file intentionally
    # does NOT change that flag — see docs/14_PRODUCTION_DEPLOY_RUNBOOK.md.
    autoDeploy: true                  # tracks the release branch above
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    # NOTE: preDeployCommand would be the ideal migrations hook but it is a
    # PAID-plan feature on Render (docs/14 §3). The free plan instead runs
    # migrations via the Docker CMD (apps/api/scripts/migrate-deploy.mjs,
    # fail-closed). When upgrading the plan, move the gate to:
    #   preDeployCommand: node apps/api/scripts/migrate-deploy.mjs
    envVars:
      # --- runtime ---
      - key: NODE_ENV
        value: production
      - key: API_GLOBAL_PREFIX
        value: api/v1
      - key: CORS_ORIGINS
        value: https://el-khabir-uat.vercel.app
      # AUD-007 (S-2): API sits behind exactly ONE Render proxy hop; trust
      # the socket only up to that hop so req.ip is the real client and
      # X-Forwarded-For cannot be spoofed further left (Express numeric
      # semantics: i < hops). Keep this in sync if the topology changes.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Render injects PORT automatically; the app reads process.env.PORT.

      # --- database (khabir-dev ONLY; never khabir-prod) ---
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # --- auth secrets (must differ from each other) ---
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: ADMIN_JWT_ACCESS_SECRET
        sync: false

      # --- production proof storage (required: local is refused in production) ---
      - key: PROOF_STORAGE_PROVIDER
        value: s3
      - key: PROOF_S3_BUCKET
        sync: false
      - key: PROOF_S3_REGION
        value: auto
      - key: PROOF_S3_ENDPOINT
        value: https://d7d91c1541b0477d145fce29389086e6.r2.cloudflarestorage.com
      - key: PROOF_S3_ACCESS_KEY_ID
        sync: false
      - key: PROOF_S3_SECRET_ACCESS_KEY
        sync: false

      # --- password-reset delivery (real webhook; optional bearer) ---
      - key: PASSWORD_RESET_DELIVERY_URL
        sync: false
      - key: PASSWORD_RESET_DELIVERY_TOKEN
        sync: false
